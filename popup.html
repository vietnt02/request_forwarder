<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Request Forwarder</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            width: 240px;
            padding: 15px;
            text-align: center;
        }

        h2 {
            font-size: 16px;
            margin-bottom: 20px;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h2>Request Forwarder</h2>

    <div class="toggle-container"
        style="margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <span style="font-size: 14px; font-weight: 500;">Extension:</span>
        <label class="switch">
            <input type="checkbox" id="globalToggle">
            <span class="slider round"></span>
        </label>
        <span id="statusText" style="font-size: 14px; color: #4CAF50; font-weight: bold;">ON</span>
    </div>

    <div class="safety-container"
        style="margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #eee;">
        <label style="font-size: 14px; font-weight: 500;">🛡️ Delay (s)</label>
        <input type="number" id="safetyDelayInput" min="0" step="0.5" placeholder="0"
            style="width: 60px; padding: 6px; border: 1px solid #ddd; border-radius: 4px; text-align: center;">
    </div>

    <button id="openOptions">⚙️ Manage Rules</button>
    <script src="popup.js"></script>
</body>

</html>
